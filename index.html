<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#74142d">
<title>ESME Mobil Stok Sayım</title>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#231f20}header{background:#74142d;color:#fff;padding:18px 16px}header h1{font-size:21px;margin:0}header p{font-size:13px;margin:5px 0 0;opacity:.9}main{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 2px 12px #00000012}.title{font-size:18px;font-weight:800;margin-bottom:10px}.note{font-size:13px;color:#6d6467;line-height:1.5}input,button{width:100%;border-radius:12px;padding:14px;font-size:16px}input{border:1px solid #d7d0d2;background:#fff}button{border:0;margin-top:9px;font-weight:800}.primary{background:#74142d;color:#fff}.dark{background:#252122;color:#fff}.light{background:#ece7e9;color:#332b2e}.camera{display:none}.camera.on{display:block}video{width:100%;min-height:300px;max-height:62vh;object-fit:cover;background:#000;border-radius:14px}.status{padding:12px;margin-top:10px;border-radius:10px;background:#f4f4f5;font-weight:700;font-size:14px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.big{font-size:22px;font-weight:900}.count{font-size:42px;font-weight:900;color:#74142d;text-align:center;margin:8px 0}.frame{position:relative}.guide{position:absolute;left:7%;right:7%;top:37%;height:26%;border:3px solid #fff;border-radius:12px;pointer-events:none}.line{position:absolute;left:8%;right:8%;top:50%;height:3px;background:#ff1744;pointer-events:none}
</style>
</head>
<body>
<header><h1>ESME • Mobil Stok Sayım</h1><p>iPhone kamera barkod okuyucu • Her okutma = +1</p></header>
<main>
<div class="card"><div class="title">Google Stok Sistemine Bağlan</div><div class="note">Aşağıdaki alana mevcut Google Apps Script /exec bağlantını bir kez yapıştır. Telefon bunu hatırlar.</div><input id="api" placeholder="https://script.google.com/macros/s/.../exec"><button class="primary" onclick="saveApi()">BAĞLANTIYI KAYDET</button><div id="apiStatus" class="status">Bağlantı bekleniyor.</div></div>
<div class="card"><div class="title">📦 Barkod Sayım</div><input id="manual" inputmode="numeric" autocomplete="off" placeholder="Barkodu yaz / harici okuyucuyla okut"><button class="light" onclick="manualScan()">BARKODU SAY (+1)</button><button class="dark" onclick="openCamera()">📷 IPHONE KAMERASINI AÇ</button><div id="cameraArea" class="camera"><div class="frame"><video id="video" playsinline muted autoplay></video><div class="guide"></div><div class="line"></div></div><button class="light" onclick="closeCamera()">KAMERAYI KAPAT</button></div><div id="scanStatus" class="status">Hazır.</div></div>
<div class="card"><div class="title">Son Okutulan</div><div id="lastCode" class="big">—</div><div class="note">Bu telefondan başarılı okutma sayısı</div><div id="localCount" class="count">0</div></div>
</main>
<script>
let reader=null,controls=null,busy=false,lastCode='',lastTime=0,localCount=Number(localStorage.getItem('esmeLocalCount')||0);
const $=id=>document.getElementById(id);
window.addEventListener('load',()=>{ $('api').value=localStorage.getItem('esmeApi')||'https://script.google.com/macros/s/AKfycbwhJLohY5FV6YaMze8Du0T16Fj70MhuMZn67p5BfxmvXlofHxPt8lvUUVnCzvaOj6gWug/exec'; $('localCount').textContent=localCount; updateApiStatus(); });
$('manual').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();manualScan();}});
function saveApi(){const u=$('api').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)){alert('Geçerli /exec bağlantısını yapıştır.');return;}localStorage.setItem('esmeApi',u);updateApiStatus();}
function updateApiStatus(){const u=localStorage.getItem('esmeApi')||$('api').value.trim();$('apiStatus').className='status '+(u?'ok':'');$('apiStatus').textContent=u?'✓ Google stok bağlantısı hazır.':'Bağlantı bekleniyor.';}
function manualScan(){const c=clean($('manual').value);$('manual').value='';if(c)submitBarcode(c);}
async function openCamera(){try{if(!window.isSecureContext)throw new Error('Kamera HTTPS bağlantısında çalışır.');if(!navigator.mediaDevices?.getUserMedia)throw new Error('Safari kamera erişimini desteklemiyor.');$('cameraArea').classList.add('on');$('scanStatus').className='status';$('scanStatus').textContent='Kamera açılıyor...';await closeStreamOnly();reader=new ZXingBrowser.BrowserMultiFormatReader();const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();let deviceId;const back=devices.find(d=>/back|rear|environment|arka/i.test(d.label));if(back)deviceId=back.deviceId;else if(devices.length)deviceId=devices[devices.length-1].deviceId;controls=await reader.decodeFromVideoDevice(deviceId,$('video'),(result,error)=>{if(!result||busy)return;const c=clean(result.getText());const now=Date.now();if(!c||(c===lastCode&&now-lastTime<1600))return;lastCode=c;lastTime=now;submitBarcode(c);});$('scanStatus').className='status ok';$('scanStatus').textContent='● Kamera açık — barkodu çerçevenin ortasına getir.';}catch(e){$('scanStatus').className='status err';$('scanStatus').textContent='Kamera açılamadı: '+(e.message||e);}}
async function closeStreamOnly(){try{controls?.stop();}catch(e){}controls=null;const v=$('video');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}reader=null;}
async function closeCamera(){await closeStreamOnly();$('cameraArea').classList.remove('on');}
async function submitBarcode(code){if(busy)return;const api=localStorage.getItem('esmeApi')||$('api').value.trim();if(!api){$('scanStatus').className='status err';$('scanStatus').textContent='Önce Google stok bağlantısını kaydet.';return;}busy=true;$('scanStatus').className='status';$('scanStatus').textContent=code+' kaydediliyor...';try{const url=api+'?action=scan&barcode='+encodeURIComponent(code)+'&_='+Date.now();const r=await fetch(url,{method:'GET',redirect:'follow',cache:'no-store'});const text=await r.text();let data;try{data=JSON.parse(text);}catch(e){throw new Error('Apps Script API yanıtı uygun değil. Code.gs API bölümünün eklenmesi gerekiyor.');}if(data.ok===false)throw new Error(data.error||'Kayıt hatası');$('lastCode').textContent=code;localCount++;localStorage.setItem('esmeLocalCount',localCount);$('localCount').textContent=localCount;$('scanStatus').className='status ok';$('scanStatus').textContent=data.product?.name?'✓ '+data.product.name+' — 1 adet kaydedildi':'✓ '+code+' — 1 adet kaydedildi';if(navigator.vibrate)navigator.vibrate(70);}catch(e){$('scanStatus').className='status err';$('scanStatus').textContent='Kayıt yapılamadı: '+(e.message||e);}finally{busy=false;}}
function clean(v){let s=String(v??'').trim();if(s.endsWith('.0'))s=s.slice(0,-2);return s;}
</script>
</body>
</html>
