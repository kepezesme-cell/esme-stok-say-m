<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#74142d"><title>ESME Mobil Stok Sayım</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#f5f3f4;color:#231f20}header{background:#74142d;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0}header small{opacity:.88}main{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px #0001}.stats,.actions,.grid{display:grid;gap:8px}.stats{grid-template-columns:repeat(3,1fr)}.actions,.grid{grid-template-columns:1fr 1fr}.stat,.box{background:#faf7f8;border-radius:12px;padding:11px;text-align:center}.stat b,.box b{display:block;font-size:22px;color:#74142d}label{font-size:13px;font-weight:700;display:block;margin:9px 0 5px}input{width:100%;padding:14px;border:1px solid #d7d0d2;border-radius:12px;font-size:18px}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;margin-top:9px}.main{background:#74142d;color:#fff}.scan{background:#222;color:#fff}.light{background:#ece7e9;color:#3c3034}.product{display:none}.name{font-size:19px;font-weight:800}.note{font-size:12px;color:#6b6265;line-height:1.45}.result{font-size:20px;font-weight:900;text-align:center;padding:12px;border-radius:12px;margin-top:10px}.missing{background:#fee2e2;color:#991b1b}.extra{background:#dcfce7;color:#166534}.ok{background:#e5e7eb;color:#374151}.listitem{padding:12px 0;border-bottom:1px solid #eee}.listitem b{display:block}.pill{font-size:12px;font-weight:800;padding:4px 7px;border-radius:20px;background:#eee}dialog{border:0;border-radius:16px;width:min(94vw,620px);padding:16px}dialog::backdrop{background:#0008}.cameraFrame{position:relative;background:#000;border-radius:12px;overflow:hidden}.cameraFrame video{display:block;width:100%;min-height:300px;max-height:65vh;object-fit:cover}.guide{position:absolute;left:7%;right:7%;top:36%;height:28%;border:3px solid #fff;border-radius:12px;pointer-events:none}.line{position:absolute;left:8%;right:8%;top:50%;height:3px;background:#ff1744;pointer-events:none}.warn{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px;margin-top:8px}</style><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><header><h1>ESME • Mobil Stok Sayım</h1><small>Her okutma otomatik +1 adet kaydeder</small></header><main><div class="card"><b>📊 Sistem Stok Excel'i</b><p class="note">Yeni sistem stok Excel'ini istediğin zaman yükleyebilirsin. Barkodlar metin olarak korunur.</p><input id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button class="main" onclick="loadExcel()">EXCEL'DEN SİSTEM STOKLARINI YÜKLE</button><div id="excelStatus" class="note"></div></div><div class="card"><div class="stats"><div class="stat">Toplam<b id="total">0</b></div><div class="stat">Sayılan<b id="counted">0</b></div><div class="stat">Kalan<b id="remaining">0</b></div></div></div><div class="card"><label>Barkod / Ürün Kodu</label><input id="search" autocomplete="off" inputmode="numeric" placeholder="Barkodu okut veya yaz"><div class="actions"><button class="scan" onclick="openScanner()">📷 SAYIMA BAŞLA</button><button class="light" onclick="manualFind()">ÜRÜNÜ BUL</button></div><div id="scanMsg" class="note"></div></div><div class="card product" id="productCard"><div class="name" id="pname"></div><div class="note" id="pmeta"></div><div class="grid" style="margin-top:10px"><div class="box">Sistem Stok<b id="psystem">0</b></div><div class="box">Reel Sayım<b id="plast">0</b></div></div><label>Reel Sayım (gerekirse elle düzelt)</label><input id="realQty" type="number" min="0" step="1"><div id="diff"></div><button class="main" onclick="saveCount()">ELLE DÜZELTİLEN ADEDİ KAYDET</button></div><div class="card"><div class="actions"><button class="light" onclick="showResults()">📋 SAYIM SONUÇLARI</button><button class="light" onclick="exportCSV()">⬇️ RAPOR İNDİR</button></div><button class="light" onclick="resetCounts()">YENİ SAYIM / SIFIRLA</button><div id="unknownBox" class="note"></div></div></main><dialog id="scannerDlg"><h3>Barkodu okut • Her okutma +1</h3><div class="cameraFrame"><video id="cameraVideo" playsinline muted autoplay></video><div class="guide"></div><div class="line"></div></div><div id="cameraStatus" class="note">Kamera hazırlanıyor...</div><button class="light" onclick="closeScanner()">KAPAT</button></dialog><dialog id="resultsDlg"><h3>Sayım Sonuçları</h3><div id="summary"></div><div id="resultList" style="max-height:60vh;overflow:auto"></div><button class="light" onclick="resultsDlg.close()">KAPAT</button></dialog><script>
const $=id=>document.getElementById(id);let products=JSON.parse(localStorage.getItem('esme_system_products_v2')||'[]'),counts=JSON.parse(localStorage.getItem('esme_counts_v2')||'{}'),unknown=JSON.parse(localStorage.getItem('esme_unknown_v1')||'{}'),current=null,reader=null,controls=null,lastScan='',lastAt=0;
function normText(v){return String(v??'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim()}
function barcodeKey(v){let s=normText(v).replace(/\s+/g,'').replace(/\.0$/,'');if(/^\d+(?:\.\d+)?[eE][+-]?\d+$/.test(s)){try{s=Number(s).toLocaleString('fullwide',{useGrouping:false,maximumFractionDigits:0})}catch(e){}}return s.replace(/[^0-9A-Za-z]/g,'').toUpperCase()}
function candidates(v){let s=barcodeKey(v),a=[s];if(/^0\d+$/.test(s))a.push(s.replace(/^0+/,''));if(/^\d{12}$/.test(s))a.push('0'+s);if(/^0\d{12}$/.test(s))a.push(s.slice(1));return [...new Set(a.filter(Boolean))]}
function sameCode(a,b){let A=candidates(a),B=candidates(b);return A.some(x=>B.includes(x))}
function n(v){return normText(v).toLocaleLowerCase('tr-TR').replace(/\s+/g,' ')}
function col(h,arr){let z=h.map(n);for(let x of arr){let i=z.findIndex(y=>y===x||y.includes(x));if(i>=0)return i}return-1}
function findProduct(q){return products.find(p=>sameCode(p.barcode,q)||sameCode(p.code,q))}
async function loadExcel(){try{let f=$('excelFile').files[0];if(!f)return alert('Önce Excel dosyasını seç.');$('excelStatus').textContent='Excel okunuyor...';let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});let hi=-1;for(let i=0;i<Math.min(40,rows.length);i++){let r=rows[i].map(n);if(r.some(x=>x.includes('barkod'))&&r.some(x=>x.includes('ürün')||x.includes('urun'))){hi=i;break}}if(hi<0)throw Error('Başlık satırı bulunamadı.');let h=rows[hi],ib=col(h,['barkod']),ik=col(h,['ürün kodu','urun kodu','stok kodu']),ia=col(h,['ürün adı','urun adı','ürün ad','urun ad']),im=col(h,['envanter miktarı','envanter miktari','stok miktarı','stok miktari','miktar']);if(ib<0||im<0)throw Error('Barkod veya stok miktarı sütunu bulunamadı.');let fresh=[];rows.slice(hi+1).forEach(r=>{let b=barcodeKey(r[ib]);if(!b)return;fresh.push({barcode:b,code:ik>=0?barcodeKey(r[ik]):'',name:ia>=0?normText(r[ia]):'',system:Number(String(r[im]).replace(',','.'))||0})});if(!fresh.length)throw Error('Ürün bulunamadı.');products=fresh;localStorage.setItem('esme_system_products_v2',JSON.stringify(products));updateStats();$('excelStatus').innerHTML='<b>'+products.length+' ürün yüklendi.</b> Barkodlar sisteme işlendi.';alert(products.length+' ürün sisteme yüklendi.');}catch(e){$('excelStatus').textContent='Hata: '+e.message;alert(e.message)}}
function updateStats(){$('total').textContent=products.length;let k=products.filter(p=>counts[p.barcode]!==undefined).length;$('counted').textContent=k;$('remaining').textContent=Math.max(0,products.length-k);let u=Object.entries(unknown);$('unknownBox').innerHTML=u.length?'<div class="warn"><b>Sistemde bulunamayan barkodlar:</b><br>'+u.map(([b,c])=>b+' ('+c+' kez)').join('<br>')+'</div>':''}
function display(p){current=p;$('productCard').style.display='block';$('pname').textContent=p.name||'Ürün';$('pmeta').textContent='Barkod: '+p.barcode+' • Ürün Kodu: '+p.code;$('psystem').textContent=p.system;let r=Number(counts[p.barcode]||0);$('plast').textContent=r;$('realQty').value=r;calcDiff()}
function calcDiff(){if(!current)return;let d=Number($('realQty').value||0)-Number(current.system),cl=d<0?'missing':d>0?'extra':'ok';$('diff').innerHTML='<div class="result '+cl+'">'+(d<0?Math.abs(d)+' EKSİK':d>0?d+' FAZLA':'STOK DOĞRU')+'</div>'}
$('realQty').addEventListener('input',calcDiff);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();let q=$('search').value;$('search').value='';scan(q)}});
function manualFind(){let p=findProduct($('search').value);if(!p)return alert('Bu barkod / ürün kodu sistem stoklarında bulunamadı.');display(p)}
function scan(q){q=barcodeKey(q);if(!q)return;let now=Date.now();if(q===lastScan&&now-lastAt<1100)return;lastScan=q;lastAt=now;let p=findProduct(q);if(!p){unknown[q]=Number(unknown[q]||0)+1;localStorage.setItem('esme_unknown_v1',JSON.stringify(unknown));updateStats();$('scanMsg').innerHTML='<span style="color:#991b1b"><b>'+q+'</b> sistem stokunda bulunamadı; ayrı listeye kaydedildi.</span>';if($('cameraStatus'))$('cameraStatus').textContent=q+' bulunamadı • ayrı listeye kaydedildi';return}counts[p.barcode]=Number(counts[p.barcode]||0)+1;localStorage.setItem('esme_counts_v2',JSON.stringify(counts));updateStats();display(p);$('scanMsg').innerHTML='<span style="color:#166534"><b>'+p.name+'</b> +1 kaydedildi. Reel: '+counts[p.barcode]+'</span>';if($('cameraStatus'))$('cameraStatus').textContent='✓ '+p.name+' +1 • Reel: '+counts[p.barcode];if(navigator.vibrate)navigator.vibrate(70)}
function saveCount(){if(!current)return;counts[current.barcode]=Math.max(0,Number($('realQty').value)||0);localStorage.setItem('esme_counts_v2',JSON.stringify(counts));updateStats();display(current)}
async function openScanner(){$('scannerDlg').showModal();$('cameraStatus').textContent='iPhone kamerası açılıyor...';try{await stopCam();reader=new ZXingBrowser.BrowserMultiFormatReader();let dev=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices(),back=dev.find(d=>/back|rear|environment|arka/i.test(d.label)),id=back?back.deviceId:(dev.length?dev[dev.length-1].deviceId:undefined);controls=await reader.decodeFromVideoDevice(id,$('cameraVideo'),res=>{if(res)scan(res.getText())});$('cameraStatus').textContent='Kamera açık • barkodu çerçeveye getir.'}catch(e){$('cameraStatus').textContent='Kamera açılamadı: '+e.message}}
async function stopCam(){try{controls?.stop()}catch(e){}controls=null;let v=$('cameraVideo');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}reader=null}async function closeScanner(){await stopCam();$('scannerDlg').close()}
function showResults(){let ok=0,mis=0,ext=0,arr=products.filter(p=>counts[p.barcode]!==undefined).map(p=>{let r=counts[p.barcode],d=r-p.system;if(d===0)ok++;else if(d<0)mis++;else ext++;return{...p,real:r,diff:d}});$('summary').innerHTML='<p><b>Doğru:</b> '+ok+' &nbsp; <b>Eksik:</b> '+mis+' &nbsp; <b>Fazla:</b> '+ext+'</p>';$('resultList').innerHTML=arr.length?arr.map(x=>'<div class="listitem"><b>'+x.name+'</b><small>'+x.barcode+'</small><br>Sistem: '+x.system+' • Reel: '+x.real+' • <span class="pill">'+(x.diff<0?Math.abs(x.diff)+' EKSİK':x.diff>0?x.diff+' FAZLA':'DOĞRU')+'</span></div>').join(''):'Henüz ürün sayılmadı.';$('resultsDlg').showModal()}
function exportCSV(){let rows=[['Barkod','Ürün Kodu','Ürün Adı','Sistem Stok','Reel Stok','Fark','Sonuç']];products.forEach(p=>{if(counts[p.barcode]!==undefined){let r=counts[p.barcode],d=r-p.system;rows.push([p.barcode,p.code,p.name,p.system,r,d,d<0?Math.abs(d)+' EKSİK':d>0?d+' FAZLA':'DOĞRU'])}});Object.entries(unknown).forEach(([b,c])=>rows.push([b,'','SİSTEMDE BULUNAMADI','',c,'','KONTROL']));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ESME_Stok_Sayim_Raporu.csv';a.click()}
function resetCounts(){if(confirm('Tüm reel sayım kayıtları silinsin mi?')){counts={};unknown={};localStorage.removeItem('esme_counts_v2');localStorage.removeItem('esme_unknown_v1');updateStats();$('productCard').style.display='none'}}
updateStats();$('excelStatus').innerHTML=products.length?'<b>Kayıtlı sistem stoku:</b> '+products.length+' ürün.':'Sistem stok Excel dosyanı yükle.';
</script></body></html>
